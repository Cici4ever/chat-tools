<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍊 聊天记录浏览器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Serif SC', Georgia, serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji'; background: linear-gradient(160deg, #FFF8F3 0%, #FFF0E8 40%, #F8E8E0 100%); color: #3D2E2E; min-height: 100vh; }
#root { max-width: 960px; margin: 0 auto; }
@media (min-width: 768px) {
  #root { padding: 20px 40px; zoom: 1.2; }
}
input, select, button, textarea { font-family: inherit; }
input, select, textarea { font-size: 16px !important; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: rgba(232,146,124,0.25); border-radius: 3px; }
.conv-card { transition: all 0.15s ease; cursor: pointer; }
.conv-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.07) !important; }
.msg-bubble { animation: fadeIn 0.15s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
.fab { position: fixed; bottom: 24px; right: 16px; display: flex; flex-direction: column; gap: 10px; z-index: 20; }
.fab button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(232,146,124,0.2); background: rgba(255,255,255,0.95); box-shadow: 0 2px 12px rgba(0,0,0,0.1); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
.fab button:active { transform: scale(0.92); background: rgba(232,146,124,0.1); }
.pill { display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.exp-btn { padding: 7px 14px; border-radius: 8px; border: 1px solid rgba(232,146,124,0.3); background: white; color: #E8927C; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.exp-btn:active { background: rgba(232,146,124,0.1); }
</style>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect, useMemo } = React;

/* ───────── helpers ───────── */

function highlightQuery(text, query) {
  if (!query || !query.trim()) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const parts = text.split(new RegExp(`(${escaped})`, "gi"));
  return parts.map((part, i) =>
    part.toLowerCase() === query.toLowerCase()
      ? <mark key={i} style={{ background: "#FBBF24", color: "#3D2E2E", borderRadius: 2, padding: "0 1px" }}>{part}</mark>
      : part
  );
}

function RenderText({ text, query }) {
  const parts = [];
  const regex = /(\*\*(.+?)\*\*|\*(.+?)\*|(https?:\/\/[^\s<]+))/g;
  let last = 0, match;
  while ((match = regex.exec(text)) !== null) {
    if (match.index > last) parts.push({ type: "text", content: text.slice(last, match.index) });
    if (match[2]) parts.push({ type: "bold", content: match[2] });
    else if (match[3]) parts.push({ type: "italic", content: match[3] });
    else if (match[4]) parts.push({ type: "link", content: match[4] });
    last = regex.lastIndex;
  }
  if (last < text.length) parts.push({ type: "text", content: text.slice(last) });
  if (parts.length === 0) parts.push({ type: "text", content: text });

  return parts.map((p, i) => {
    const inner = query?.trim() ? highlightQuery(p.content, query) : p.content;
    if (p.type === "bold") return <strong key={i}>{inner}</strong>;
    if (p.type === "italic") return <em key={i} style={{ fontStyle: "italic" }}>{inner}</em>;
    if (p.type === "link") return <a key={i} href={p.content} target="_blank" rel="noreferrer" style={{ color: "#D4789C", textDecoration: "underline", wordBreak: "break-all" }}>{inner}</a>;
    return <span key={i}>{inner}</span>;
  });
}

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function formatDateShort(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

function getMsgText(msg) {
  if (msg.content?.length > 0) {
    const t = msg.content.filter(c => c.type === "text" && c.text).map(c => c.text).join("\n");
    if (t.trim()) return t;
  }
  if (msg.text?.trim()) return msg.text;
  return "";
}

function getMsgThinking(msg) {
  if (!msg.content) return "";
  return msg.content.filter(c => c.type === "thinking" && c.thinking).map(c => c.thinking).join("\n");
}

function getPreview(messages, maxLen = 60) {
  for (const m of messages) {
    const t = getMsgText(m).trim();
    if (t) return t.length > maxLen ? t.slice(0, maxLen) + "…" : t;
  }
  return "（无内容）";
}

function countMessages(messages) {
  const human = messages.filter(m => m.sender === "human").length;
  const assistant = messages.filter(m => m.sender === "assistant").length;
  return { human, assistant, total: human + assistant };
}

function countChars(messages) {
  let humanChars = 0, assistantChars = 0;
  for (const m of messages) {
    const len = getMsgText(m).replace(/\s/g, "").length;
    if (m.sender === "human") humanChars += len;
    else if (m.sender === "assistant") assistantChars += len;
  }
  return { human: humanChars, assistant: assistantChars, total: humanChars + assistantChars };
}

function formatChars(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + "万";
  if (n >= 1000) return (n / 1000).toFixed(1) + "k";
  return String(n);
}

function countOccurrences(messages, query, includeThinking) {
  if (!query?.trim()) return 0;
  const q = query.toLowerCase();
  let total = 0;
  for (const m of messages) {
    const text = getMsgText(m).toLowerCase();
    let idx = 0;
    while ((idx = text.indexOf(q, idx)) !== -1) { total++; idx += q.length; }
    if (includeThinking) {
      const thinking = getMsgThinking(m).toLowerCase();
      idx = 0;
      while ((idx = thinking.indexOf(q, idx)) !== -1) { total++; idx += q.length; }
    }
  }
  return total;
}

function hasImages(msg) {
  if (!msg.content) return false;
  return msg.content.some(c => c.type === "image" || (c.type === "tool_result" && c.content?.some?.(cc => cc.type === "image")));
}

function markBranches(messages) {
  const result = messages.map(m => ({...m, _bs: "normal", _bl: ""}));
  for (let i = 0; i < result.length; i++) {
    if (result[i]._bs !== "normal") continue;
    /* assistant分支：连续多条assistant */
    if (result[i].sender === "assistant") {
      let j = i;
      while (j + 1 < result.length && result[j+1].sender === "assistant") j++;
      if (j > i) {
        const total = j - i + 1;
        for (let k = i; k < j; k++) {
          result[k]._bs = "abandoned";
          result[k]._bl = "Claude 版本 " + (k-i+1) + "/" + total + "（未选中）";
        }
        i = j;
        continue;
      }
    }
    /* human编辑重发：human→assistant→human(相似)→assistant */
    if (result[i].sender === "human" && i + 3 < result.length
        && result[i+1].sender === "assistant"
        && result[i+2].sender === "human"
        && result[i+3].sender === "assistant") {
      const t1 = getMsgText(result[i]).slice(0, 30);
      const t2 = getMsgText(result[i+2]).slice(0, 30);
      if (t1 && t2 && t1 === t2) {
        result[i]._bs = "abandoned";
        result[i]._bl = "已编辑（旧版本）";
        result[i+1]._bs = "abandoned";
        result[i+1]._bl = "旧版本的回复（未选中）";
        i += 1;
        continue;
      }
    }
    /* human编辑重发（空assistant）：human→空assistant→human */
    if (result[i].sender === "human" && i + 2 < result.length
        && result[i+1].sender === "assistant" && !getMsgText(result[i+1]).trim()
        && result[i+2].sender === "human") {
      result[i]._bs = "abandoned";
      result[i]._bl = "已编辑（旧版本）";
      result[i+1]._bs = "skip";
    }
  }
  return result;
}

function getExcerpts(msg) {
  return (msg.attachments || []).filter(a => a.file_name && a.file_name.includes("excerpt") && a.extracted_content);
}

function getNonExcerptAttachments(msg) {
  return (msg.attachments || []).filter(a => a.file_name && !a.file_name.includes("excerpt"));
}

function getFileAttachments(msg) {
  return (msg.files || []).filter(f => f.file_name);
}

function getSearchSnippet(messages, query, maxLen = 80) {
  if (!query?.trim()) return null;
  const q = query.toLowerCase();
  for (const m of messages) {
    const text = getMsgText(m);
    const idx = text.toLowerCase().indexOf(q);
    if (idx >= 0) {
      const sender = m.sender === "human" ? "橙橙" : "Claude";
      const start = Math.max(0, idx - 20);
      const end = Math.min(text.length, idx + q.length + 40);
      const snippet = (start > 0 ? "…" : "") + text.slice(start, end) + (end < text.length ? "…" : "");
      return { sender, snippet, matchIdx: idx - start + (start > 0 ? 1 : 0) };
    }
  }
  return null;
}

/* ───────── export helpers ───────── */

function downloadFile(content, filename, type) {
  /* 先尝试复制到剪贴板 */
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(content).then(() => {
      alert("已复制到剪贴板！打开备忘录粘贴保存即可。\n\n如果在电脑上使用，文件也会自动下载。");
      tryDownload(content, filename, type);
    }).catch(() => {
      showCopyModal(content);
      tryDownload(content, filename, type);
    });
  } else {
    showCopyModal(content);
    tryDownload(content, filename, type);
  }
}

function tryDownload(content, filename, type) {
  try {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) {}
}

function showCopyModal(content) {
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;";
  const box = document.createElement("div");
  box.style.cssText = "background:white;border-radius:12px;padding:16px;max-width:100%;max-height:80vh;display:flex;flex-direction:column;gap:10px;width:100%;";
  box.innerHTML = '<div style="font-size:14px;font-weight:600;color:#3D2E2E;">长按下方文字全选复制</div>';
  const textarea = document.createElement("textarea");
  textarea.value = content;
  textarea.readOnly = true;
  textarea.style.cssText = "width:100%;height:60vh;border:1px solid #ddd;border-radius:8px;padding:10px;font-size:12px;line-height:1.6;resize:none;";
  const btn = document.createElement("button");
  btn.textContent = "关闭";
  btn.style.cssText = "padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#E8927C,#D4789C);color:white;font-size:16px;font-weight:600;cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;";
  btn.addEventListener("touchend", (e) => { e.preventDefault(); overlay.remove(); });
  btn.addEventListener("click", () => overlay.remove());
  box.appendChild(textarea);
  box.appendChild(btn);
  overlay.appendChild(box);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
  textarea.focus();
  textarea.select();
}

function stripMarkdown(text) {
  return text.replace(/\*\*(.+?)\*\*/g, "$1").replace(/\*(.+?)\*/g, "$1").replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2300}-\u{23FF}\u{2B50}-\u{2B55}\u{FE00}-\u{FE0F}\u{200D}\u{20E3}\u{E0020}-\u{E007F}\u{2702}-\u{27B0}\u{00A9}\u{00AE}\u{203C}\u{2049}\u{2122}\u{2139}\u{2194}-\u{21AA}\u{231A}-\u{231B}\u{25AA}-\u{25FE}\u{2660}-\u{2668}\u{267B}-\u{267F}\u{2692}-\u{269C}\u{26A0}-\u{26FA}\u{2702}-\u{2764}\u{FE0F}\u{200B}-\u{200D}]/gu, "").replace(/\u00A0/g, " ");
}

function convToTxt(conv) {
  const name = conv.name || "未命名对话";
  const msgs = conv.chat_messages || [];
  const marked = markBranches(msgs);
  const lines = [
    `${"=".repeat(50)}`,
    `  ${name}`,
    `${"=".repeat(50)}`,
    `创建时间: ${formatDate(conv.created_at)}`,
    `最后活跃: ${formatDate(conv.updated_at)}`,
    ``,
    `${"-".repeat(50)}`,
    ``
  ];
  for (const m of marked) {
    if (m._bs === "skip" || m._bs === "abandoned") continue;
    const text = getMsgText(m).trim();
    const excerpts = getExcerpts(m);
    const files = getFileAttachments(m);
    const otherAtts = getNonExcerptAttachments(m);
    if (!text && !excerpts.length && !files.length && !otherAtts.length) continue;
    const sender = m.sender === "human" ? "[橙橙]" : "[Claude]";
    const time = formatDate(m.created_at);
    lines.push(`${sender} ${time}`);
    lines.push(``);
    for (const e of excerpts) {
      lines.push(`> 引用: ${stripMarkdown(e.extracted_content)}`);
      lines.push(``);
    }
    for (const f of files) {
      const icon = /\.(jpe?g|png|gif|webp)$/i.test(f.file_name) ? "图片" : "文件";
      lines.push(`[${icon}: ${f.file_name}]`);
    }
    for (const a of otherAtts) {
      lines.push(`[附件: ${a.file_name}]`);
    }
    if (text) lines.push(stripMarkdown(text).replace(/\n/g, "\r\n"));
    lines.push(``);
    lines.push(`${"-".repeat(50)}`);
    lines.push(``);
  }
  return lines.join("\r\n");
}

function exportConvTxt(conv) {
  const txt = convToTxt(conv);
  try { downloadFile("\uFEFF" + txt, (conv.name || "对话").replace(/[\\/:*?"<>|]/g, "_") + ".txt", "text/plain;charset=utf-8"); } catch(e) {}
  showCopyModal(txt);
}

function exportFilteredJson(convs, single) {
  const data = single ? [single] : convs;
  const clean = data.map(c => ({
    uuid: c.uuid, name: c.name, created_at: c.created_at, updated_at: c.updated_at,
    chat_messages: c.chat_messages
  }));
  const name = single ? (single.name || "对话").replace(/[\\/:*?"<>|]/g, "_") : "conversations_filtered";
  const json = JSON.stringify(clean, null, 2);
  try { downloadFile(json, name + ".json", "application/json;charset=utf-8"); } catch(e) {}
  showCopyModal(json);
}

/* ───────── constants ───────── */

const accent = "#E8927C";
const accentGrad = "linear-gradient(135deg, #E8927C, #D4789C)";

/* ───────── message block ───────── */

function MessageBlock({ block, bi, isHuman, msgSearch, searchThinking }) {
  if (block.type === "thinking" && !isHuman) {
    let thinkMatchCount = 0;
    if (searchThinking && msgSearch?.trim()) {
      const q = msgSearch.toLowerCase();
      const t = block.thinking.toLowerCase();
      let idx = 0;
      while ((idx = t.indexOf(q, idx)) !== -1) { thinkMatchCount++; idx += q.length; }
    }
    const duration = (block.start_timestamp && block.stop_timestamp) ? ((new Date(block.stop_timestamp) - new Date(block.start_timestamp)) / 1000).toFixed(1) : null;
    const summary = block.summaries?.[0]?.summary || null;
    return (
      <details key={bi} className={thinkMatchCount > 0 ? "thinking-match" : undefined} style={{ maxWidth: "85%", marginBottom: 6 }}>
        <summary style={{ fontSize: 12, color: thinkMatchCount > 0 ? "#9C7CE8" : "#B0A0A0", fontWeight: thinkMatchCount > 0 ? 600 : 400, cursor: "pointer", padding: "6px 12px", background: thinkMatchCount > 0 ? "rgba(156,124,232,0.1)" : "rgba(156,124,232,0.06)", borderRadius: 8, border: thinkMatchCount > 0 ? "1px solid rgba(156,124,232,0.3)" : "1px dashed rgba(156,124,232,0.25)", userSelect: "none", display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
          <span>💭 思考过程</span>
          {duration && <span style={{ padding: "1px 6px", borderRadius: 4, fontSize: 10, fontWeight: 600, background: thinkMatchCount > 0 ? "rgba(156,124,232,0.2)" : "rgba(156,124,232,0.12)", color: thinkMatchCount > 0 ? "#7B5EC2" : "#A090C0" }}>{duration}s</span>}
          {thinkMatchCount > 0 && <span>（含 {thinkMatchCount} 次匹配）</span>}
          {summary && !thinkMatchCount && <span style={{ color: "#C0B0D0", fontWeight: 400 }}>— {summary}</span>}
        </summary>
        <div style={{ padding: "10px 14px", marginTop: 4, background: "rgba(156,124,232,0.04)", borderRadius: 10, border: "1px solid rgba(156,124,232,0.1)", fontSize: 12, lineHeight: 1.7, color: "#7D6B9E", whiteSpace: "pre-wrap", wordBreak: "break-word", maxHeight: 300, overflowY: "auto" }}>
          {searchThinking && msgSearch?.trim() ? <RenderText text={block.thinking} query={msgSearch} /> : block.thinking}
        </div>
      </details>
    );
  }
  if (block.type === "tool_use") {
    if (block.name === "ask_user_input_v0" && block.input?.questions) {
      return (
        <div key={bi} style={{ maxWidth: "85%", marginBottom: 6, padding: "10px 14px", background: "rgba(232,186,124,0.08)", borderRadius: 10, border: "1px solid rgba(232,186,124,0.2)" }}>
          {block.input.questions.map((q, qi) => (
            <div key={qi} style={{ marginBottom: qi < block.input.questions.length - 1 ? 10 : 0 }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: "#B8860B", marginBottom: 6 }}>💬 {q.question}</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {(q.options || []).map((opt, oi) => (
                  <span key={oi} style={{ display: "inline-block", padding: "4px 10px", borderRadius: 99, fontSize: 11, background: "rgba(232,186,124,0.15)", color: "#8B6914", border: "1px solid rgba(232,186,124,0.3)" }}>
                    {opt}
                  </span>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }
    const toolDuration = (block.start_timestamp && block.stop_timestamp) ? ((new Date(block.stop_timestamp) - new Date(block.start_timestamp)) / 1000).toFixed(1) : null;
    const inputJson = block.input ? JSON.stringify(block.input, null, 2) : "";
    return (
      <details key={bi} style={{ maxWidth: "85%", marginBottom: 6 }}>
        <summary style={{ fontSize: 12, color: "#7C9CE8", cursor: "pointer", padding: "4px 10px", background: "rgba(124,156,232,0.08)", borderRadius: 6, userSelect: "none", display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
          <span>🔧 {block.name || "工具调用"}</span>
          {toolDuration && <span style={{ padding: "1px 6px", borderRadius: 4, fontSize: 10, fontWeight: 600, background: "rgba(124,156,232,0.15)", color: "#5B7EC2" }}>{toolDuration}s</span>}
          {block.input?.query && <span style={{ color: "#A0B8E0", fontWeight: 400 }}>— {block.input.query}</span>}
        </summary>
        {inputJson && (
          <div style={{ padding: "6px 10px", marginTop: 4, background: "rgba(124,156,232,0.04)", borderRadius: 6, border: "1px solid rgba(124,156,232,0.1)" }}>
            <div style={{ fontSize: 10, fontWeight: 600, color: "#7C9CE8", marginBottom: 2 }}>Input</div>
            <pre style={{ fontSize: 11, lineHeight: 1.5, color: "#5B7EC2", margin: 0, whiteSpace: "pre-wrap", wordBreak: "break-word", fontFamily: "monospace" }}>{inputJson}</pre>
          </div>
        )}
      </details>
    );
  }
  if (block.type === "tool_result") {
    if (block.name === "ask_user_input_v0") return null;
    const rawText = block.content?.find(c => c.type === "text")?.text || "";
    const chatRegex = /<chat\s+url='([^']+)'[^>]*>[\s]*(?:Content:\s*\n)?(?:Title:\s*)?([^\n]+)/g;
    const chats = [];
    let cm;
    while ((cm = chatRegex.exec(rawText)) !== null) {
      chats.push({ url: cm[1], title: cm[2].trim() });
    }
    const isSearch = block.name === "conversation_search" || block.name === "recent_chats";
    /* 完整原始文本 */
    const hasContent = rawText.trim().length > 0;
    if (chats.length === 0 && !hasContent) return null;
    return (
      <details key={bi} style={{ maxWidth: "85%", marginBottom: 6 }}>
        <summary style={{ fontSize: 12, color: "#7C9CE8", cursor: "pointer", padding: "6px 12px", background: "rgba(124,156,232,0.06)", borderRadius: 8, border: "1px dashed rgba(124,156,232,0.2)", userSelect: "none" }}>
          🔍 {isSearch ? "搜索结果" : "结果"}{chats.length > 0 ? ` · ${chats.length} 条` : ""}（点击展开）
        </summary>
        <div style={{ padding: "6px 12px", marginTop: 4, background: "rgba(124,156,232,0.04)", borderRadius: 8, border: "1px solid rgba(124,156,232,0.1)" }}>
          {chats.length > 0 && chats.map((c, ci) => (
            <div key={ci} style={{ padding: "4px 0", borderTop: ci > 0 ? "1px solid rgba(124,156,232,0.08)" : "none" }}>
              <a href={c.url} target="_blank" rel="noreferrer" style={{ fontSize: 12, color: "#5B7EC2", textDecoration: "none", lineHeight: 1.6, display: "block" }}>
                💬 {c.title}
              </a>
            </div>
          ))}
          {hasContent && (
            <div style={{ marginTop: chats.length > 0 ? 6 : 0, paddingTop: chats.length > 0 ? 6 : 0, borderTop: chats.length > 0 ? "1px solid rgba(124,156,232,0.1)" : "none" }}>
              <div style={{ fontSize: 10, fontWeight: 600, color: "#7C9CE8", marginBottom: 2 }}>Result</div>
              <pre style={{ fontSize: 11, lineHeight: 1.5, color: "#8090B0", margin: 0, whiteSpace: "pre-wrap", wordBreak: "break-word", fontFamily: "inherit", maxHeight: 300, overflowY: "auto" }}>{rawText}</pre>
            </div>
          )}
        </div>
      </details>
    );
  }
  if (block.type === "image") {
    return (
      <div key={bi} style={{ maxWidth: "85%", marginBottom: 6, padding: "10px 14px", background: "rgba(232,146,124,0.06)", borderRadius: 10, border: "1px dashed rgba(232,146,124,0.2)", fontSize: 12, color: "#B0A0A0" }}>
        🖼️ 图片附件
      </div>
    );
  }
  if (block.type === "text" && block.text?.trim()) {
    const hasTextMatch = msgSearch?.trim() && block.text.toLowerCase().includes(msgSearch.toLowerCase());
    return (
      <div key={bi} className={`text-bubble${hasTextMatch ? " text-match" : ""}`} style={{
        maxWidth: "85%", padding: "12px 16px", marginBottom: 6,
        borderRadius: isHuman ? "16px 16px 4px 16px" : "16px 16px 16px 4px",
        background: isHuman ? accentGrad : "white",
        color: isHuman ? "white" : "#3D2E2E",
        fontSize: 15, lineHeight: 1.8,
        boxShadow: isHuman ? "0 2px 8px rgba(232,146,124,0.2)" : "0 2px 8px rgba(0,0,0,0.04)",
        whiteSpace: "pre-wrap", wordBreak: "break-word",
      }}>
        <RenderText text={block.text} query={msgSearch} />
      </div>
    );
  }
  return null;
}

/* ───────── main ───────── */

const BATCH = 80;

function ChatBrowser() {
  const [conversations, setConversations] = useState(null);
  const [loading, setLoading] = useState(false);
  const [loadingMsg, setLoadingMsg] = useState("");
  const [search, setSearch] = useState("");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [selectedId, setSelectedId] = useState(null);
  const [senderFilter, setSenderFilter] = useState("all");
  const [msgSearch, setMsgSearch] = useState("");
  const [sortBy, setSortBy] = useState("active_desc");
  const [visibleCount, setVisibleCount] = useState(BATCH);
  const [listScroll, setListScroll] = useState(0);
  const [scrollToUuid, setScrollToUuid] = useState(null);
  const [searchThinking, setSearchThinking] = useState(false);
  const fileRef = useRef();
  const msgAreaRef = useRef();
  const firstMatchRef = useRef();
  const bottomRef = useRef();
  const scrollTargetRef = useRef();
  const leavingRef = useRef(false);

  function goBackToList() {
    const savedScroll = listScroll;
    leavingRef.current = true;
    setSelectedId(null); setMsgSearch(""); setSenderFilter("all"); setSearchThinking(false);
    /* 多帧持续恢复滚动位置，确保React渲染完后位置不被冲掉 */
    let frames = 0;
    function restore() {
      window.scrollTo(0, savedScroll);
      frames++;
      if (frames < 20) {
        requestAnimationFrame(restore);
      } else {
        leavingRef.current = false;
      }
    }
    requestAnimationFrame(restore);
  }

  useEffect(() => {
    const handler = (e) => {
      if (e.key === "Escape" && selectedId) goBackToList();
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [selectedId]);

  /* auto-scroll: scroll to first matching content element */
  useEffect(() => {
    if (!selectedId || !msgSearch.trim() || leavingRef.current) return;
    let scrolled = false;

    function doScroll() {
      if (leavingRef.current || scrolled) return;
      let target = null;
      if (searchThinking) {
        /* 勾选思考链：找第一个匹配元素（思考链或文本，DOM顺序谁先谁赢） */
        target = document.querySelector(".thinking-match, .text-match");
      } else {
        /* 未勾选：找第一个包含关键词的文本bubble */
        target = document.querySelector(".text-match");
      }
      if (!target) target = document.querySelector("[data-first-match]");
      if (target) {
        const rect = target.getBoundingClientRect();
        const y = window.scrollY + rect.top - window.innerHeight / 3;
        window.scrollTo(0, Math.max(0, y));
        scrolled = true;
      }
    }

    const timers = [300, 800, 2000].map(ms => setTimeout(doScroll, ms));
    return () => timers.forEach(clearTimeout);
  }, [selectedId, msgSearch, searchThinking]);

  useEffect(() => {
    if (!selectedId) return;
    const handler = () => {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 200) {
        setVisibleCount(v => v + BATCH);
      }
    };
    window.addEventListener("scroll", handler);
    return () => window.removeEventListener("scroll", handler);
  }, [selectedId]);

  useEffect(() => { setVisibleCount(msgSearch.trim() ? 99999 : BATCH); }, [selectedId]);

  /* scroll to specific message by uuid */
  useEffect(() => {
    if (scrollToUuid && scrollTargetRef.current) {
      setTimeout(() => scrollTargetRef.current?.scrollIntoView({ behavior: "auto", block: "center" }), 200);
      setTimeout(() => setScrollToUuid(null), 1000);
    }
  }, [scrollToUuid, visibleCount]);

  function locateInContext(msgUuid) {
    setMsgSearch("");
    setSenderFilter("all");
    /* load all messages so the target is rendered */
    const allMsgs = selected?.chat_messages || [];
    setVisibleCount(allMsgs.length);
    setScrollToUuid(msgUuid);
  }

  function copyText(text) {
    const clean = text.replace(/\*\*(.+?)\*\*/g, "$1").replace(/\*(.+?)\*/g, "$1");
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(clean).then(() => {
        /* brief visual feedback via a toast */
        const t = document.createElement("div");
        t.textContent = "已复制";
        t.style.cssText = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:white;padding:8px 20px;border-radius:8px;font-size:14px;z-index:999;pointer-events:none;";
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1200);
      }).catch(() => {});
    }
  }

  const handleFile = useCallback((e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setLoading(true);
    setLoadingMsg("读取文件中…");
    const reader = new FileReader();
    reader.onload = (ev) => {
      setLoadingMsg("解析数据中…");
      setTimeout(() => {
        try {
          const data = JSON.parse(ev.target.result);
          setLoadingMsg(`处理 ${data.length} 个对话…`);
          setTimeout(() => {
            const withContent = data.filter(c => {
              if (!c.chat_messages || c.chat_messages.length < 5) return false;
              return c.chat_messages.some(m => getMsgText(m).trim().length > 0);
            });
            const sorted = withContent.sort((a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
            setConversations(sorted);
            setLoading(false);
          }, 50);
        } catch {
          alert("JSON 解析失败，请检查文件格式");
          setLoading(false);
        }
      }, 50);
    };
    reader.readAsText(file);
  }, []);

  const filtered = useMemo(() => {
    if (!conversations) return [];
    let list = conversations.filter(c => {
      if (dateFrom && new Date(c.updated_at || c.created_at) < new Date(dateFrom)) return false;
      if (dateTo) { const to = new Date(dateTo); to.setDate(to.getDate() + 1); if (new Date(c.updated_at || c.created_at) >= to) return false; }
      if (search.trim()) {
        const q = search.toLowerCase();
        return (c.name || "").toLowerCase().includes(q) || c.chat_messages?.some(m => getMsgText(m).toLowerCase().includes(q));
      }
      return true;
    });
    if (sortBy === "active_desc") list = [...list].sort((a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at));
    else if (sortBy === "active_asc") list = [...list].sort((a, b) => new Date(a.updated_at || a.created_at) - new Date(b.updated_at || b.created_at));
    else if (sortBy === "created_desc") list = [...list].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    else if (sortBy === "created_asc") list = [...list].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    else if (sortBy === "chars_desc") list = [...list].sort((a, b) => countChars(b.chat_messages || []).total - countChars(a.chat_messages || []).total);
    else if (sortBy === "msg_desc") list = [...list].sort((a, b) => (b.chat_messages?.length || 0) - (a.chat_messages?.length || 0));
    return list;
  }, [conversations, search, dateFrom, dateTo, sortBy]);

  const selected = selectedId ? conversations?.find(c => c.uuid === selectedId) : null;

  const selectedMessages = useMemo(() => {
    if (!selected) return [];
    const marked = markBranches(selected.chat_messages || []);
    return marked.filter(m => {
      if (m._bs === "skip") return false;
      if (senderFilter !== "all" && m.sender !== senderFilter) return false;
      if (msgSearch.trim()) {
        /* searching: hide abandoned versions */
        if (m._bs === "abandoned") return false;
        const q = msgSearch.toLowerCase();
        const inText = getMsgText(m).toLowerCase().includes(q);
        const inThinking = searchThinking && getMsgThinking(m).toLowerCase().includes(q);
        return inText || inThinking;
      }
      return true;
    });
  }, [selected, senderFilter, msgSearch, searchThinking]);

  const visibleMessages = selectedMessages.slice(0, visibleCount);
  const hasMore = visibleCount < selectedMessages.length;

  const totalConvs = conversations?.length || 0;
  const totalMsgs = conversations?.reduce((s, c) => s + (c.chat_messages?.length || 0), 0) || 0;
  const totalChars = conversations?.reduce((s, c) => s + (c.chat_messages || []).reduce((ss, m) => ss + getMsgText(m).replace(/\s/g, "").length, 0), 0) || 0;
  const totalByRole = useMemo(() => {
    if (!conversations) return { humanMsgs: 0, assistantMsgs: 0, humanChars: 0, assistantChars: 0 };
    let hm = 0, am = 0, hc = 0, ac = 0;
    for (const c of conversations) {
      for (const m of (c.chat_messages || [])) {
        const len = getMsgText(m).replace(/\s/g, "").length;
        if (m.sender === "human") { hm++; hc += len; }
        else if (m.sender === "assistant") { am++; ac += len; }
      }
    }
    return { humanMsgs: hm, assistantMsgs: am, humanChars: hc, assistantChars: ac };
  }, [conversations]);

  /* ─── UPLOAD SCREEN ─── */
  if (!conversations) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ textAlign: "center", padding: 40, maxWidth: 400 }}>
          <div style={{ fontSize: 72, marginBottom: 20 }}>🍊</div>
          <h1 style={{ fontSize: 28, fontWeight: 700, marginBottom: 10, letterSpacing: 2 }}>聊天记录浏览器</h1>
          <p style={{ fontSize: 15, color: "#A08080", marginBottom: 28, lineHeight: 1.8 }}>
            上传从 Claude 导出的 conversations.json<br />
            按窗口浏览 · 关键词搜索 · 按日期筛选<br />
            导出 TXT / JSON
          </p>
          <input ref={fileRef} type="file" accept=".json" onChange={handleFile} style={{ display: "none" }} />
          <button
            onClick={() => fileRef.current?.click()}
            disabled={loading}
            style={{ padding: "14px 36px", borderRadius: 12, border: "none", background: loading ? "#ccc" : accentGrad, color: "white", fontSize: 17, fontWeight: 700, cursor: loading ? "wait" : "pointer", letterSpacing: 2, boxShadow: "0 4px 16px rgba(232,146,124,0.3)" }}
          >
            {loading ? (
              <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ display: "inline-block", width: 14, height: 14, border: "2px solid rgba(255,255,255,0.3)", borderTopColor: "white", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />
                {loadingMsg}
              </span>
            ) : "选择 JSON 文件"}
          </button>
          <p style={{ fontSize: 13, color: "#C0A0A0", marginTop: 16 }}>
            Safari / Chrome 均可使用 · 纯本地处理，不上传任何数据
          </p>
        </div>
      </div>
    );
  }

  /* ─── DETAIL VIEW ─── */
  if (selected) {
    const counts = countMessages(selected.chat_messages || []);
    const chars = countChars(selected.chat_messages || []);
    const filteredTotal = selectedMessages.length;
    const occurrences = msgSearch.trim() ? countOccurrences(selectedMessages, msgSearch, searchThinking) : 0;
    let firstMatchIdx = -1;
    firstMatchRef.current = null;

    return (
      <div style={{ minHeight: "100vh" }}>
        {/* sticky header */}
        <div style={{ padding: "14px 20px", borderBottom: "1px solid rgba(232,146,124,0.15)", background: "#FFF6F0", position: "sticky", top: 0, zIndex: 10 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
            <button onClick={goBackToList} style={{ background: "none", border: "none", color: accent, fontSize: 15, fontWeight: 600, cursor: "pointer", padding: 0 }}>
              ← 返回列表 <span style={{ fontSize: 12, color: "#B0A0A0" }}>（Esc）</span>
            </button>
            <div style={{ display: "flex", gap: 6 }}>
              <button className="exp-btn" onClick={() => exportConvTxt(selected)}>导出 TXT</button>
              <button className="exp-btn" onClick={() => exportFilteredJson(null, selected)}>导出 JSON</button>
            </div>
          </div>
          <h2 style={{ fontSize: 20, fontWeight: 700, marginBottom: 4, lineHeight: 1.4 }}>
            {selected.name || formatDate(selected.created_at)}
          </h2>
          <div style={{ fontSize: 14, color: "#7D6B6B", fontWeight: 500, display: "flex", flexWrap: "wrap", gap: 4 }}>
            <span>{formatDate(selected.created_at)}</span>
            <span>·</span>
            <span>{counts.total} 条消息</span>
            <span>（<span style={{ color: "#D4789C", fontWeight: 600 }}>橙橙 {counts.human}</span> / <span style={{ color: "#7C9CE8", fontWeight: 600 }}>Claude {counts.assistant}</span>）</span>
          </div>
          <div style={{ fontSize: 14, color: "#7D6B6B", fontWeight: 500, marginTop: 2, display: "flex", flexWrap: "wrap", gap: 4 }}>
            <span>共 {formatChars(chars.total)} 字</span>
            <span>（<span style={{ color: "#D4789C", fontWeight: 600 }}>橙橙 {formatChars(chars.human)}</span> / <span style={{ color: "#7C9CE8", fontWeight: 600 }}>Claude {formatChars(chars.assistant)}</span>）</span>
            {msgSearch.trim() && (
              <span style={{ color: accent, fontWeight: 600 }}>· {filteredTotal} 条消息中共出现 {occurrences} 次</span>
            )}
            {!msgSearch.trim() && senderFilter !== "all" && (
              <span style={{ color: accent, fontWeight: 600 }}>· 当前筛选 {filteredTotal} 条</span>
            )}
          </div>

          {/* filters */}
          <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
            <div style={{ position: "relative", flex: 1, minWidth: 140 }}>
              <input
                value={msgSearch}
                onChange={e => setMsgSearch(e.target.value)}
                placeholder="搜索本窗口…"
                style={{ width: "100%", padding: "8px 12px", paddingRight: 32, borderRadius: 8, border: "1px solid rgba(232,146,124,0.2)", fontSize: 12, background: "rgba(255,255,255,0.7)", outline: "none" }}
              />
              {msgSearch && (
                <button onClick={() => setMsgSearch("")} style={{ position: "absolute", right: 6, top: "50%", transform: "translateY(-50%)", width: 22, height: 22, borderRadius: "50%", border: "none", background: "rgba(232,146,124,0.15)", color: accent, fontSize: 12, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0, lineHeight: 1 }}>×</button>
              )}
            </div>
            <select value={senderFilter} onChange={e => setSenderFilter(e.target.value)} style={{ padding: "8px 12px", borderRadius: 8, border: "1px solid rgba(232,146,124,0.2)", fontSize: 12, background: "rgba(255,255,255,0.7)" }}>
              <option value="all">全部</option>
              <option value="human">只看橙橙</option>
              <option value="assistant">只看Claude</option>
            </select>
            <label style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12, color: "#9C7CE8", cursor: "pointer", whiteSpace: "nowrap" }}>
              <input type="checkbox" checked={searchThinking} onChange={e => setSearchThinking(e.target.checked)} style={{ width: 16, height: 16 }} />
              搜思考链
            </label>
          </div>
        </div>

        {/* messages */}
        <div ref={msgAreaRef} style={{ padding: "16px 20px 80px" }}>
          {visibleMessages.length === 0 && (
            <div style={{ textAlign: "center", padding: 40, color: "#C0A0A0", fontSize: 13 }}>无匹配消息</div>
          )}
          {(() => { const markedMsgs = visibleMessages; return markedMsgs.map((m, i) => {
            if (m._bs === "skip") return null;
            const text = getMsgText(m);
            const thinking = getMsgThinking(m);
            const excerpts = getExcerpts(m);
            const fileAtts = getFileAttachments(m);
            const otherAtts = getNonExcerptAttachments(m);
            if (!text.trim() && !thinking.trim() && !hasImages(m) && !excerpts.length && !fileAtts.length && !otherAtts.length) return null;
            const isHuman = m.sender === "human";

            const seenThinking = new Set();
            const blocks = (m.content || []).filter(b => {
              if (!((b.type === "text" && b.text?.trim()) || (b.type === "thinking" && b.thinking?.trim()) || b.type === "tool_use" || b.type === "tool_result" || b.type === "image")) return false;
              if (b.type === "thinking") {
                const k = b.thinking.trim();
                if (seenThinking.has(k)) return false;
                seenThinking.add(k);
              }
              return true;
            });

            let isMatch = false;
            if (msgSearch.trim()) {
              const q = msgSearch.toLowerCase();
              isMatch = text.toLowerCase().includes(q) || (searchThinking && thinking.toLowerCase().includes(q));
            }
            let refProp = {};
            if (isMatch && firstMatchIdx === -1) {
              firstMatchIdx = i;
              refProp = { "data-first-match": "true" };
            }

            const origIdx = (selected.chat_messages || []).findIndex(orig => orig.uuid === m.uuid);

            /* 分支：被放弃的版本折叠 */
            if (m._bs === "abandoned") {
              return (
                <details key={m.uuid || i} style={{ marginBottom: 8 }}>
                  <summary style={{ fontSize: 12, color: "#B0A0A0", cursor: "pointer", padding: "6px 12px", background: "rgba(200,180,180,0.08)", borderRadius: 8, border: "1px dashed rgba(200,180,180,0.3)", userSelect: "none", display: "flex", alignItems: "center", gap: 6 }}>
                    <span>{isHuman ? "🔄" : "🔄"}</span>
                    <span>{m._bl}</span>
                    <span style={{ color: "#D0C0C0" }}>#{origIdx + 1}</span>
                  </summary>
                  <div className="msg-bubble" style={{ marginTop: 6, marginBottom: 6, display: "flex", flexDirection: "column", alignItems: isHuman ? "flex-end" : "flex-start", opacity: 0.6 }}>
                    <div style={{ fontSize: 12, color: "#B0A0A0", marginBottom: 3, padding: "0 4px" }}>
                      <span style={{ fontWeight: 600 }}>{isHuman ? "橙橙" : "Claude"}</span> {formatDate(m.created_at)}
                    </div>
                    {blocks.length > 0 ? blocks.map((block, bi) => (
                      <MessageBlock key={bi} block={block} bi={bi} isHuman={isHuman} msgSearch={msgSearch} searchThinking={searchThinking} />
                    )) : text.trim() ? (
                      <div style={{
                        maxWidth: "85%", padding: "12px 16px",
                        borderRadius: isHuman ? "16px 16px 4px 16px" : "16px 16px 16px 4px",
                        background: isHuman ? "rgba(232,146,124,0.4)" : "rgba(255,255,255,0.5)",
                        color: isHuman ? "white" : "#3D2E2E",
                        fontSize: 15, lineHeight: 1.8, whiteSpace: "pre-wrap", wordBreak: "break-word",
                      }}>
                        <RenderText text={text} query={msgSearch} />
                      </div>
                    ) : null}
                  </div>
                </details>
              );
            }

            const isScrollTarget = scrollToUuid === m.uuid;
            const scrollRef = isScrollTarget ? { ref: scrollTargetRef } : {};

            return (
              <div key={m.uuid || i} data-msg-uuid={m.uuid} {...refProp} {...scrollRef} className="msg-bubble" style={{ marginBottom: 16, display: "flex", flexDirection: "column", alignItems: isHuman ? "flex-end" : "flex-start", transition: "all 0.3s", borderLeft: isScrollTarget ? "3px solid #D4789C" : "none", paddingLeft: isScrollTarget ? 8 : 0 }}>
                <div style={{ fontSize: 12, color: "#B0A0A0", marginBottom: 3, padding: "0 4px", display: "flex", gap: 6, alignItems: "center" }}>
                  <span style={{ fontWeight: 600 }}>{isHuman ? "橙橙" : "Claude"}</span>
                  <span>{formatDate(m.created_at)}</span>
                  <span style={{ color: "#D0C0C0" }}>#{origIdx + 1}</span>
                  {text.trim() && (
                    <span onClick={(e) => { e.stopPropagation(); copyText(text); }} style={{ cursor: "pointer", opacity: 0.4, fontSize: 13 }} title="复制">📋</span>
                  )}
                  {msgSearch.trim() && isMatch && (
                    <span onClick={(e) => { e.stopPropagation(); locateInContext(m.uuid); }} style={{ cursor: "pointer", opacity: 0.6, fontSize: 13 }} title="定位到原文位置">📍</span>
                  )}
                </div>
                {/* 引用消息 */}
                {excerpts.map((a, ai) => (
                  <div key={"exc"+ai} style={{ maxWidth: "85%", marginBottom: 6, padding: "8px 12px", borderLeft: "3px solid #D4789C", background: "rgba(212,120,156,0.06)", borderRadius: "0 8px 8px 0", fontSize: 13, color: "#8D7070", fontWeight: 400, lineHeight: 1.6, fontStyle: "italic" }}>
                    💬 引用：{a.extracted_content}
                  </div>
                ))}
                {/* 上传的图片/文件 */}
                {fileAtts.map((f, fi) => (
                  <div key={"file"+fi} style={{ maxWidth: "85%", marginBottom: 6, padding: "6px 10px", background: isHuman ? "rgba(232,146,124,0.15)" : "rgba(232,146,124,0.06)", borderRadius: 8, fontSize: 11, color: isHuman ? "#C06050" : "#B0A0A0" }}>
                    {/\.(jpe?g|png|gif|webp)$/i.test(f.file_name) ? "🖼️" : "📎"} {f.file_name}
                  </div>
                ))}
                {/* 其他附件 */}
                {otherAtts.map((a, ai) => (
                  <details key={"att"+ai} style={{ maxWidth: "85%", marginBottom: 6 }}>
                    <summary style={{ fontSize: 12, color: "#B0A0A0", cursor: "pointer", padding: "4px 10px", background: "rgba(232,146,124,0.06)", borderRadius: 6, userSelect: "none" }}>
                      📎 {a.file_name} {a.file_size ? "(" + (a.file_size > 1024 ? Math.round(a.file_size/1024)+"KB" : a.file_size+"B") + ")" : ""}
                    </summary>
                    {a.extracted_content && (
                      <div style={{ padding: "8px 12px", marginTop: 4, background: "rgba(0,0,0,0.02)", borderRadius: 6, fontSize: 12, lineHeight: 1.6, whiteSpace: "pre-wrap", wordBreak: "break-word", maxHeight: 200, overflowY: "auto" }}>
                        {a.extracted_content}
                      </div>
                    )}
                  </details>
                ))}
                {/* 消息内容 */}
                {blocks.length > 0 ? blocks.map((block, bi) => (
                  <MessageBlock key={bi} block={block} bi={bi} isHuman={isHuman} msgSearch={msgSearch} searchThinking={searchThinking} />
                )) : text.trim() ? (
                  <div style={{
                    maxWidth: "85%", padding: "12px 16px",
                    borderRadius: isHuman ? "16px 16px 4px 16px" : "16px 16px 16px 4px",
                    background: isHuman ? accentGrad : "white",
                    color: isHuman ? "white" : "#3D2E2E",
                    fontSize: 15, lineHeight: 1.8,
                    boxShadow: isHuman ? "0 2px 8px rgba(232,146,124,0.2)" : "0 2px 8px rgba(0,0,0,0.04)",
                    whiteSpace: "pre-wrap", wordBreak: "break-word",
                  }}>
                    <RenderText text={text} query={msgSearch} />
                  </div>
                ) : null}
              </div>
            );
          }); })()}
          {hasMore && (
            <div style={{ textAlign: "center", padding: 20 }}>
              <button onClick={() => setVisibleCount(v => v + BATCH)} style={{ padding: "8px 24px", borderRadius: 8, border: `1px solid ${accent}`, background: "white", color: accent, fontSize: 12, cursor: "pointer" }}>
                加载更多（剩余 {selectedMessages.length - visibleCount} 条）
              </button>
            </div>
          )}
          <div ref={bottomRef} />
        </div>

        {/* FAB */}
        <div className="fab">
          <button onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })} title="回到顶部">↑</button>
          <button onClick={() => { setVisibleCount(selectedMessages.length); setTimeout(() => { if(bottomRef.current) bottomRef.current.scrollIntoView({ behavior: "auto" }); }, 500); }} title="到底部">↓</button>
        </div>
      </div>
    );
  }

  /* ─── LIST VIEW ─── */
  return (
    <div style={{ minHeight: "100vh" }}>
      {/* Header */}
      <div style={{ padding: "20px 20px 16px", borderBottom: "1px solid rgba(232,146,124,0.15)" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <h1 style={{ fontSize: 22, fontWeight: 700, letterSpacing: 1 }}>🍊 聊天记录</h1>
          <div style={{ display: "flex", gap: 6 }}>
            <input ref={fileRef} type="file" accept=".json" onChange={handleFile} style={{ display: "none" }} />
            <button className="exp-btn" onClick={() => fileRef.current?.click()}>换文件</button>
          </div>
        </div>

        {/* stats */}
        <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
          <span className="pill" style={{ background: "rgba(232,146,124,0.1)", color: accent }}>{totalConvs} 个窗口</span>
          <span className="pill" style={{ background: "rgba(212,120,156,0.1)", color: "#D4789C" }}>{totalMsgs.toLocaleString()} 条消息</span>
          <span className="pill" style={{ background: "rgba(156,124,232,0.1)", color: "#9C7CE8" }}>{formatChars(totalChars)} 字</span>
          <span className="pill" style={{ background: "rgba(124,180,156,0.15)", color: "#5A9E7E" }}>显示 {filtered.length} 个</span>
        </div>
        <div style={{ fontSize: 13, color: "#7D6B6B", marginBottom: 10, lineHeight: 1.8 }}>
          <span style={{ color: "#D4789C", fontWeight: 600 }}>橙橙</span> {totalByRole.humanMsgs.toLocaleString()} 条 · {formatChars(totalByRole.humanChars)} 字
          <span style={{ margin: "0 8px", color: "#D0C0C0" }}>|</span>
          <span style={{ color: "#7C9CE8", fontWeight: 600 }}>Claude</span> {totalByRole.assistantMsgs.toLocaleString()} 条 · {formatChars(totalByRole.assistantChars)} 字
        </div>

        {/* export buttons */}
        <div style={{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>
          <button className="exp-btn" onClick={() => { const allTxt = filtered.map(c => convToTxt(c)).join("\r\n\r\n"); const fn = "conversations_all.txt"; try { downloadFile("\uFEFF" + allTxt, fn, "text/plain;charset=utf-8"); } catch(e) {} showCopyModal(allTxt); }}>导出全部 TXT（{filtered.length}个窗口）</button>
        </div>

        {/* search */}
        <div style={{ position: "relative", marginBottom: 10 }}>
          <input
            value={search}
            onChange={e => setSearch(e.target.value)}
            placeholder="搜索关键词（窗口名 / 聊天内容）…"
            style={{ width: "100%", padding: "10px 14px", paddingRight: 36, borderRadius: 10, border: "1px solid rgba(232,146,124,0.2)", background: "rgba(255,255,255,0.7)", fontSize: 13, outline: "none" }}
          />
          {search && (
            <button onClick={() => setSearch("")} style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", width: 24, height: 24, borderRadius: "50%", border: "none", background: "rgba(232,146,124,0.15)", color: accent, fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0, lineHeight: 1 }}>×</button>
          )}
        </div>

        {/* date + sort */}
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <span style={{ fontSize: 11, color: "#A08080", whiteSpace: "nowrap" }}>时间范围</span>
          <input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} style={{ flex: 1, minWidth: 100, padding: "7px 10px", borderRadius: 8, border: "1px solid rgba(232,146,124,0.2)", fontSize: 12, background: "rgba(255,255,255,0.7)" }} />
          <span style={{ fontSize: 11, color: "#C0A0A0" }}>—</span>
          <input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} style={{ flex: 1, minWidth: 100, padding: "7px 10px", borderRadius: 8, border: "1px solid rgba(232,146,124,0.2)", fontSize: 12, background: "rgba(255,255,255,0.7)" }} />
          {(dateFrom || dateTo) && (
            <button onClick={() => { setDateFrom(""); setDateTo(""); }} style={{ padding: "6px 10px", borderRadius: 6, border: "none", background: "rgba(232,146,124,0.1)", color: accent, fontSize: 11, cursor: "pointer", whiteSpace: "nowrap" }}>清除</button>
          )}
        </div>
        <div style={{ marginTop: 8, display: "flex", gap: 6, alignItems: "center" }}>
          <span style={{ fontSize: 11, color: "#A08080" }}>排序</span>
          <select value={sortBy} onChange={e => setSortBy(e.target.value)} style={{ padding: "5px 10px", borderRadius: 6, border: "1px solid rgba(232,146,124,0.2)", fontSize: 11, background: "rgba(255,255,255,0.7)", color: "#3D2E2E" }}>
            <option value="active_desc">最近活跃</option>
            <option value="active_asc">最早活跃</option>
            <option value="created_desc">最新创建</option>
            <option value="created_asc">最早创建</option>
            <option value="chars_desc">字数最多</option>
            <option value="msg_desc">消息最多</option>
          </select>
        </div>
      </div>

      {/* Conversation list */}
      <div style={{ padding: "12px 20px 40px" }}>
        {filtered.length === 0 && (
          <div style={{ textAlign: "center", padding: 48, color: "#C0A0A0" }}>
            <div style={{ fontSize: 28, marginBottom: 8 }}>🔍</div>
            <div style={{ fontSize: 13 }}>没有找到匹配的窗口</div>
          </div>
        )}
        {filtered.map(c => {
          const counts = countMessages(c.chat_messages || []);
          const chars = countChars(c.chat_messages || []);
          const preview = getPreview(c.chat_messages || []);
          const matchCount = search.trim() ? (c.chat_messages || []).filter(m => getMsgText(m).toLowerCase().includes(search.toLowerCase())).length : 0;
          const matchOccurrences = search.trim() ? countOccurrences(c.chat_messages || [], search) : 0;
          /* search preview: first match context */
          let matchSnippet = null;
          if (search.trim() && matchCount > 0) {
            const q = search.toLowerCase();
            for (const m of (c.chat_messages || [])) {
              const t = getMsgText(m);
              const idx = t.toLowerCase().indexOf(q);
              if (idx >= 0) {
                const start = Math.max(0, idx - 20);
                const end = Math.min(t.length, idx + q.length + 30);
                const sender = m.sender === "human" ? "橙橙" : "Claude";
                matchSnippet = { sender, before: (start > 0 ? "…" : "") + t.slice(start, idx), match: t.slice(idx, idx + q.length), after: t.slice(idx + q.length, end) + (end < t.length ? "…" : "") };
                break;
              }
            }
          }
          const humanPct = counts.total > 0 ? (counts.human / counts.total) * 100 : 50;

          return (
            <div
              key={c.uuid}
              className="conv-card"
              onClick={() => { setListScroll(window.scrollY); setSelectedId(c.uuid); if (search.trim()) setMsgSearch(search); window.scrollTo(0, 0); }}
              style={{ marginBottom: 10, padding: "14px 16px", background: "white", borderRadius: 12, boxShadow: "0 2px 8px rgba(0,0,0,0.03)", borderLeft: `3px solid ${accent}` }}
            >
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
                <div style={{ fontSize: 17, fontWeight: 700, flex: 1, marginRight: 8, lineHeight: 1.4 }}>
                  {c.name || formatDateShort(c.created_at) + " 的对话"}
                </div>
                <div style={{ fontSize: 14, color: "#B0A0A0", fontWeight: 500, whiteSpace: "nowrap", textAlign: "right" }}>
                  {search.trim() && matchCount > 0 && (
                    <span style={{ color: accent, fontWeight: 600 }}>{matchCount}条/{matchOccurrences}次<br /></span>
                  )}
                  {counts.total}条 · {formatChars(chars.total)}字
                </div>
              </div>
              <div style={{ fontSize: 15, color: "#8D7070", fontWeight: 400, marginBottom: 8, lineHeight: 1.6 }}>{preview}</div>
              {matchSnippet && (
                <div style={{ fontSize: 13, marginBottom: 8, padding: "6px 10px", background: "rgba(251,191,36,0.08)", borderRadius: 6, borderLeft: "3px solid #FBBF24", lineHeight: 1.6, color: "#8D7070" }}>
                  <span style={{ fontSize: 11, color: "#B0A0A0", fontWeight: 600 }}>{matchSnippet.sender}：</span>
                  {matchSnippet.before}<mark style={{ background: "#FBBF24", color: "#3D2E2E", borderRadius: 2, padding: "0 1px" }}>{matchSnippet.match}</mark>{matchSnippet.after}
                </div>
              )}
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                <div style={{ flex: 1, height: 3, borderRadius: 2, background: "#F0E0E0", overflow: "hidden" }}>
                  <div style={{ width: `${humanPct}%`, height: "100%", background: accentGrad, borderRadius: 2 }} />
                </div>
                <span style={{ fontSize: 12, fontWeight: 500, whiteSpace: "nowrap" }}><span style={{ color: "#D4789C" }}>{counts.human}</span>:<span style={{ color: "#7C9CE8" }}>{counts.assistant}</span></span>
              </div>
              <div style={{ fontSize: 13, color: "#C0A0A0" }}>
                创建 {formatDate(c.created_at)}{c.updated_at ? ` · 最后活跃 ${formatDate(c.updated_at)}` : ""}
              </div>
            </div>
          );
        })}
        <div ref={bottomRef} />
      </div>

      {/* FAB */}
      <div className="fab">
        <button onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })} title="回到顶部">↑</button>
        <button onClick={() => bottomRef.current?.scrollIntoView({ behavior: "smooth" })} title="到底部">↓</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ChatBrowser />);
</script>
</body>
</html>
