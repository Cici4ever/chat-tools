<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧠 记忆库</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'PingFang SC', sans-serif; background: #1a1a2e; color: #e0d8cc; min-height: 100vh; }
.container { max-width: 640px; margin: 0 auto; padding: 20px 16px 100px; }

/* header */
.header { text-align: center; padding: 24px 0 16px; }
.header h1 { font-size: 22px; font-weight: 700; color: #f5e6d3; letter-spacing: 2px; }
.header .sub { font-size: 12px; color: #8a7f72; margin-top: 4px; }
.stats { display: flex; justify-content: center; gap: 16px; margin-top: 12px; font-size: 12px; color: #a89880; }
.stats span { background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; }

/* tabs */
.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #8a7f72; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
.tab.active { background: rgba(232,146,124,0.15); border-color: #E8927C; color: #E8927C; }

/* search */
.search-bar { position: relative; margin: 8px 0 16px; }
.search-bar input { width: 100%; padding: 10px 14px 10px 36px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: #e0d8cc; font-size: 14px; outline: none; }
.search-bar input::placeholder { color: #5a5248; }
.search-bar input:focus { border-color: rgba(232,146,124,0.3); }
.search-bar::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; }

/* cards */
.card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 16px; margin-bottom: 12px; transition: all 0.15s; }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.card-meta { font-size: 11px; color: #6a5f52; }
.card-layer { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; margin-right: 6px; }
.layer-core { background: rgba(232,146,124,0.15); color: #E8927C; }
.layer-daily { background: rgba(250,204,21,0.12); color: #FBBF24; }
.layer-diary { background: rgba(147,130,220,0.15); color: #9382DC; }
.layer-milestone { background: rgba(52,211,153,0.12); color: #34D399; }
.card-emotion { font-size: 18px; }
.card-title { font-size: 15px; font-weight: 700; color: #f5e6d3; margin-bottom: 6px; line-height: 1.4; }
.card-content { font-size: 13px; line-height: 1.7; color: #b0a898; white-space: pre-wrap; word-break: break-word; }
.card-content.collapsed { max-height: 80px; overflow: hidden; position: relative; }
.card-content.collapsed::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40px; background: linear-gradient(transparent, rgba(26,26,46,0.95)); }
.card-expand { color: #E8927C; font-size: 12px; cursor: pointer; margin-top: 6px; display: inline-block; }
.card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.card-tags span { font-size: 10px; padding: 2px 8px; border-radius: 8px; background: rgba(255,255,255,0.05); color: #8a7f72; }
.card-id { font-size: 10px; color: #4a4540; margin-top: 8px; font-family: monospace; }

/* empty */
.empty { text-align: center; padding: 60px 20px; color: #5a5248; }
.empty .icon { font-size: 40px; margin-bottom: 12px; }

/* loading */
.loading { text-align: center; padding: 40px; color: #6a5f52; }
.loading::after { content: ''; display: inline-block; width: 16px; height: 16px; border: 2px solid #6a5f52; border-top-color: #E8927C; border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* error */
.error { text-align: center; padding: 40px 20px; color: #C85050; }
.error .retry { margin-top: 12px; padding: 8px 20px; border-radius: 10px; border: 1px solid #C85050; background: transparent; color: #C85050; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<div class="container" id="app"></div>
<script>
const MCP_URL = 'https://memory-mcp.mollyhooper.workers.dev/mcp';
let allMemories = [];
let currentLayer = 'all';
let searchQuery = '';
let expandedIds = new Set();

// JSON-RPC helper
async function mcpCall(method, params = {}) {
  const resp = await fetch(MCP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/call', params: { name: method, arguments: params } })
  });
  const data = await resp.json();
  if (data.result && data.result.content) return data.result.content[0].text;
  throw new Error(data.error?.message || 'Unknown error');
}

// Parse memory text into structured data
function parseMemories(text) {
  const memories = [];
  const blocks = text.split(/\n【/).filter(Boolean);
  for (const block of blocks) {
    const clean = block.startsWith('【') ? block : '【' + block;
    const idMatch = clean.match(/【([^\]】]+)】/);
    const layerMatch = clean.match(/】\s*(\w+)\s*\|/);
    const dateMatch = clean.match(/\|\s*([\d-]+)\s*\|/);
    const emotionMatch = clean.match(/\|\s*([\d-]+)\s*\|\s*(.+)?$/m);
    const titleMatch = clean.match(/标题：(.+)/);
    const tagsMatch = clean.match(/标签：(.+)/);
    const lines = clean.split('\n');
    
    let content = '';
    let capturing = false;
    for (const line of lines) {
      if (line.startsWith('标题：')) { capturing = true; continue; }
      if (line.startsWith('标签：')) { capturing = false; continue; }
      if (capturing && line.trim()) content += line + '\n';
    }

    if (idMatch) {
      memories.push({
        id: idMatch[1],
        layer: layerMatch ? layerMatch[1] : 'unknown',
        date: dateMatch ? dateMatch[1] : '',
        emotion: emotionMatch && emotionMatch[2] ? emotionMatch[2].trim() : '',
        title: titleMatch ? titleMatch[1].trim() : '',
        content: content.trim(),
        tags: tagsMatch ? tagsMatch[1].split('、').map(t => t.trim()) : []
      });
    }
  }
  return memories;
}

async function loadMemories() {
  render('loading');
  try {
    const text = await mcpCall('memory_read', { layer: 'all' });
    if (text.includes('没有记忆')) {
      allMemories = [];
    } else {
      allMemories = parseMemories(text);
    }
    render('main');
  } catch (err) {
    render('error', err.message);
  }
}

function getFiltered() {
  let list = currentLayer === 'all' ? allMemories : allMemories.filter(m => m.layer === currentLayer);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(m => 
      m.title.toLowerCase().includes(q) || 
      m.content.toLowerCase().includes(q) ||
      m.tags.some(t => t.toLowerCase().includes(q))
    );
  }
  return list;
}

function render(mode, extra) {
  const app = document.getElementById('app');
  
  if (mode === 'loading') {
    app.innerHTML = '<div class="header"><h1>🧠 记忆库</h1></div><div class="loading">加载中</div>';
    return;
  }
  
  if (mode === 'error') {
    app.innerHTML = `<div class="header"><h1>🧠 记忆库</h1></div><div class="error">加载失败：${extra}<br><button class="retry" onclick="loadMemories()">重试</button></div>`;
    return;
  }

  const layers = ['all', 'core', 'daily', 'diary', 'milestone'];
  const layerNames = { all: '全部', core: '深层', daily: '日常', diary: '日记', milestone: '里程碑' };
  const layerCounts = {};
  for (const l of layers) {
    layerCounts[l] = l === 'all' ? allMemories.length : allMemories.filter(m => m.layer === l).length;
  }
  
  const totalChars = allMemories.reduce((s, m) => s + m.content.length + m.title.length, 0);
  const filtered = getFiltered();

  let html = `
    <div class="header">
      <h1>🧠 记忆库</h1>
      <div class="sub">橙橙和Claude的跨窗口记忆</div>
      <div class="stats">
        <span>${allMemories.length} 条记忆</span>
        <span>${totalChars} 字</span>
      </div>
    </div>
    <div class="tabs">
      ${layers.filter(l => l === 'all' || layerCounts[l] > 0).map(l => 
        `<div class="tab ${currentLayer === l ? 'active' : ''}" onclick="setLayer('${l}')">${layerNames[l]}${l !== 'all' ? ' ' + layerCounts[l] : ''}</div>`
      ).join('')}
    </div>
    <div class="search-bar">
      <input type="text" placeholder="搜索记忆..." value="${searchQuery}" oninput="doSearch(this.value)" />
    </div>
  `;

  if (filtered.length === 0) {
    html += `<div class="empty"><div class="icon">🍊</div>没有找到记忆</div>`;
  } else {
    for (const m of filtered) {
      const expanded = expandedIds.has(m.id);
      const needCollapse = m.content.length > 100;
      html += `
        <div class="card">
          <div class="card-header">
            <div class="card-meta">
              <span class="card-layer layer-${m.layer}">${m.layer}</span>
              ${m.date}
            </div>
            ${m.emotion ? `<span class="card-emotion">${m.emotion}</span>` : ''}
          </div>
          <div class="card-title">${m.title}</div>
          <div class="card-content ${needCollapse && !expanded ? 'collapsed' : ''}">${m.content}</div>
          ${needCollapse ? `<span class="card-expand" onclick="toggleExpand('${m.id}')">${expanded ? '▲ 收起' : '▼ 展开'}</span>` : ''}
          ${m.tags.length ? `<div class="card-tags">${m.tags.map(t => `<span>${t}</span>`).join('')}</div>` : ''}
          <div class="card-id">${m.id}</div>
        </div>
      `;
    }
  }

  app.innerHTML = html;
}

function setLayer(l) { currentLayer = l; render('main'); }
function doSearch(q) { searchQuery = q; render('main'); }
function toggleExpand(id) { expandedIds.has(id) ? expandedIds.delete(id) : expandedIds.add(id); render('main'); }

loadMemories();
</script>
</body>
</html>
